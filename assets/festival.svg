<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <!-- Sfondo Rosa Chiaro -->
  <rect width="1200" height="600" rx="24" fill="#faedf0" />
  
  <!-- Cerchio Grande (Nuovo Viola #782b7a) -->
  <circle cx="796" cy="300" r="212" fill="#782b7a" />
  
  <!-- Cerchio Piccolo in alto a destra (Verde bosco) -->
  <circle cx="1040" cy="120" r="55" fill="#115338" />
  
  <!-- Quadrato Arrotondato a sinistra (Verde bosco) -->
  <rect x="80" y="80" width="420" height="440" rx="36" fill="#115338" />
  
  <!-- Due linee orizzontali in basso a sinistra (Azzurro/Cyan) -->
  <rect x="100" y="440" width="380" height="12" rx="6" fill="#0284c7" />
  <rect x="100" y="480" width="380" height="12" rx="6" fill="#0284c7" />
  
  <!-- Rettangolo centrale sovrapposto (Azzurro/Cyan vivo) -->
  <rect x="400" y="220" width="330" height="160" rx="24" fill="#0ea5e9" />
</svg>